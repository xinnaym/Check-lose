name: Deploy to GitHub Pages

on:
  # Запускать при каждом пуше в ветку main (или master)
  push:
    branches: [main]
  # Позволяет запускать деплой вручную со вкладки Actions
  workflow_dispatch:

# Разрешения, необходимые для публикации на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Отменяет старый деплой, если запущен новый
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'npm'  # закомментировано: требует package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Укажите './dist' для Vite или './build' для Create React App
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
